{% extends 'tracker/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Вхід у систему</h3>
                
                {% if form.errors %}
                    <div class="alert alert-danger">Неправильне ім'я користувача або пароль.</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Ім'я користувача:</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль:</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Увійти</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
