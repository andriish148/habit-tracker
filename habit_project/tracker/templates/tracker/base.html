{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій Трекер Звичок</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        .navbar-custom-text {
            color: #f8f9fa !important;
            font-weight: 500;
            margin-right: 10px;
        }
        
        .navbar form {
            display: inline-block;
            margin-left: 5px;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1; 
        }

        .custom-footer {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body.bg-theme-dark .custom-footer {
            background-color: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
        }
        body.bg-theme-dark .custom-footer a {
            color: #60a5fa; 
            text-decoration: none;
        }
        body.bg-theme-dark .custom-footer a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        body.bg-theme-light .custom-footer {
            color: #475569;
        }
        body.bg-theme-light .custom-footer a {
            color: #3b82f6;
            text-decoration: none;
        }
        body.bg-theme-light .custom-footer a:hover {
            color: #2563eb;
            text-decoration: underline;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'habit_list' %}">Мій Трекер</a>
            
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="navbar-custom-text">Привіт, {{ user.username }}!</span>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-light">Вийти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Увійти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="custom-footer py-3 mt-auto">
        <div class="container text-end">
            <p class="mb-1 small fw-bold">Habit Tracker Project</p>
            <p class="mb-0 small">
                <a href="https://github.com/andriish148" target="_blank"><i class="bi bi-github"></i> GitHub</a> |                 <a href="https://t.me/qlivv137" target="_blank"><i class="bi bi-telegram"></i> Telegram</a> |
                <span class="ms-1">&copy; Andrii Shevchenko</span>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
